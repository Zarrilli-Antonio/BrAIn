<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#000000"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8cff6b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8cff6b" stop-opacity="0"/>
    </radialGradient>
    <!-- Green -> Azure, the same second hue already used for the Ambient Light Points
         (ambient-azure-1 in DESIGN.md) — extended here rather than a new invented hue. -->
    <linearGradient id="brainStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8cff6b"/>
      <stop offset="100%" stop-color="#60b5ff"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="26" fill="url(#glow)"/>
  <!-- Real brain geometry, adapted from Lucide's "brain" icon (ISC license — see
       THIRD-PARTY-NOTICES.md), not hand-traced: three attempts at freehand bezier paths all
       failed to actually read as a brain, verified against a real render each time. Native
       24x24 viewBox scaled/centered into ours; stroke-width scales along with the group
       transform so the proportions that make it legible at small sizes come along automatically. -->
  <g transform="translate(12,12) scale(1.6667)" fill="none" stroke="url(#brainStroke)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 18V5" />
    <path d="M15 13a4.17 4.17 0 0 1-3-4 4.17 4.17 0 0 1-3 4" />
    <path d="M17.598 6.5A3 3 0 1 0 12 5a3 3 0 1 0-5.598 1.5" />
    <path d="M17.997 5.125a4 4 0 0 1 2.526 5.77" />
    <path d="M18 18a4 4 0 0 0 2-7.464" />
    <path d="M19.967 17.483A4 4 0 1 1 12 18a4 4 0 1 1-7.967-.517" />
    <path d="M6 18a4 4 0 0 1-2-7.464" />
    <path d="M6.003 5.125a4 4 0 0 0-2.526 5.77" />
  </g>
</svg>
