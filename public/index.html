<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BrAIn — Project Explorer</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<style>
  :root {
    --bg:#000000; --text:#eafbe9; --muted:#7fae82; --green:#8cff6b;
    --glass:rgba(3,10,5,0.30); --glass-border:rgba(140,255,107,0.18); --glass-hover:rgba(140,255,107,0.10);
    --radius:4px;
  }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body {
    margin:0; font-family: system-ui, sans-serif; color:var(--text); display:flex; gap:16px; padding:16px;
    overflow:hidden; position:relative; background:var(--bg);
  }
  .lights { position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
  .light {
    position:absolute; border-radius:50%; filter:blur(70px); will-change:transform;
    animation-timing-function:ease-in-out; animation-iteration-count:infinite;
  }
  /* Centered on the seams that are never covered by a glass panel: the page-edge
     gutter (16px) and the aside/main gap (16px, fixed at x=304 since aside is 280px
     + 16px padding + 8px half-gap). A panel-covered blob is invisible; a blob
     centered on a seam shows its peak intensity in that thin visible strip.
     The other axis is also centered (on an arbitrary vh/vw point) purely so a much
     bigger circle stays visually balanced instead of overflowing lopsided. */
  .light.l1 { top:calc(20vh - 630px); left:-622px; width:1260px; height:1260px; opacity:.8;
    background:radial-gradient(circle, rgba(140,255,107,0.8), transparent 58%);
    animation-name:drift1; animation-duration:22s; }
  .light.l2 { top:-532px; left:calc(60vw - 540px); width:1080px; height:1080px; opacity:.78;
    background:radial-gradient(circle, rgba(96,181,255,0.8), transparent 58%);
    animation-name:drift2; animation-duration:27s; animation-delay:-6s; }
  .light.l3 { top:calc(75vh - 720px); left:calc(100vw - 728px); width:1440px; height:1440px; opacity:.72;
    background:radial-gradient(circle, rgba(140,255,107,0.72), transparent 58%);
    animation-name:drift3; animation-duration:19s; animation-delay:-11s; }
  .light.l4 { top:calc(100vh - 458px); left:calc(20vw - 450px); width:900px; height:900px; opacity:.78;
    background:radial-gradient(circle, rgba(60,180,90,0.8), transparent 58%);
    animation-name:drift1; animation-duration:25s; animation-delay:-4s; }
  .light.l5 { top:calc(55vh - 390px); left:-86px; width:780px; height:780px; opacity:.72;
    background:radial-gradient(circle, rgba(150,220,255,0.75), transparent 58%);
    animation-name:drift2; animation-duration:16s; animation-delay:-9s; }
  .light.l6 { top:calc(15vh - 330px); left:-26px; width:660px; height:660px; opacity:.68;
    background:radial-gradient(circle, rgba(140,255,107,0.7), transparent 58%);
    animation-name:drift3; animation-duration:21s; animation-delay:-14s; }
  .light.l7 { top:calc(65vh - 405px); left:-397px; width:810px; height:810px; opacity:.7;
    background:radial-gradient(circle, rgba(180,130,255,0.75), transparent 58%);
    animation-name:drift2; animation-duration:24s; animation-delay:-3s; }
  .light.l8 { top:calc(80vh - 350px); left:-46px; width:700px; height:700px; opacity:.68;
    background:radial-gradient(circle, rgba(200,160,255,0.7), transparent 58%);
    animation-name:drift1; animation-duration:18s; animation-delay:-7s; }
  .light.l9 { top:calc(100vh - 408px); left:calc(65vw - 400px); width:800px; height:800px; opacity:.7;
    background:radial-gradient(circle, rgba(110,190,255,0.75), transparent 58%);
    animation-name:drift3; animation-duration:23s; animation-delay:-2s; }
  .light.l10 { top:calc(25vh - 500px); left:calc(100vw - 508px); width:1000px; height:1000px; opacity:.75;
    background:radial-gradient(circle, rgba(140,255,107,0.75), transparent 58%);
    animation-name:drift2; animation-duration:20s; animation-delay:-13s; }
  @keyframes drift1 {
    0%   { transform:translate(0, 0) scale(1); }
    25%  { transform:translate(6%, 8%) scale(1.12); }
    55%  { transform:translate(-4%, 12%) scale(0.94); }
    80%  { transform:translate(-8%, -3%) scale(1.05); }
    100% { transform:translate(0, 0) scale(1); }
  }
  @keyframes drift2 {
    0%   { transform:translate(0, 0) scale(1); }
    30%  { transform:translate(-9%, 5%) scale(1.08); }
    60%  { transform:translate(-3%, -10%) scale(0.92); }
    85%  { transform:translate(7%, 4%) scale(1.1); }
    100% { transform:translate(0, 0) scale(1); }
  }
  @keyframes drift3 {
    0%   { transform:translate(0, 0) scale(1); }
    20%  { transform:translate(5%, -7%) scale(0.95); }
    50%  { transform:translate(10%, 6%) scale(1.1); }
    75%  { transform:translate(-6%, 9%) scale(1); }
    100% { transform:translate(0, 0) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .light { animation:none; }
  }
  aside, main {
    background:var(--glass); backdrop-filter: blur(28px) saturate(140%); -webkit-backdrop-filter: blur(28px) saturate(140%);
    border:1px solid var(--glass-border); border-radius:var(--radius);
    box-shadow: 0 24px 60px -20px rgba(0,0,0,0.7), inset 0 1px 0 rgba(140,255,107,0.08);
  }
  aside { width:280px; overflow-y:auto; padding:14px; }
  main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  header { padding:12px 20px; border-bottom:1px solid var(--glass-border); display:flex; gap:12px; align-items:center; }
  .icon-btn {
    display:none; align-items:center; justify-content:center; width:40px; height:40px; flex:none;
    background:#000000; border:1px solid var(--glass-border); color:var(--text); cursor:pointer; border-radius:var(--radius);
  }
  .icon-btn svg { width:20px; height:20px; }
  header input {
    flex:1; background:#000000; border:1px solid var(--glass-border); color:var(--text);
    padding:8px 16px; border-radius:var(--radius); font-size:13px; transition:border-color .15s ease, box-shadow .15s ease;
  }
  header input:focus { outline:none; border-color:var(--green); box-shadow:0 0 0 3px rgba(140,255,107,0.15); }
  ::selection { background:rgba(140,255,107,0.35); color:var(--text); }
  ::placeholder { color:var(--muted); opacity:1; }
  input, textarea { caret-color:var(--green); }
  html { scrollbar-color:var(--glass-border) transparent; scrollbar-width:thin; }
  .tab:focus-visible, .node:focus-visible, .icon-btn:focus-visible,
  .toolbar button:focus-visible, a.wikilink:focus-visible {
    outline:2px solid var(--green); outline-offset:2px;
  }
  #content { flex:1; overflow:auto; padding:20px; font-family: ui-monospace, monospace; font-size:13px; }
  #content.code { white-space:pre-wrap; }
  #content.code a[data-path] { color:var(--green); text-decoration:none; border-bottom:1px dashed rgba(140,255,107,0.5); cursor:pointer; }
  #content.doc { white-space:normal; font-family: system-ui, sans-serif; font-size:14px; line-height:1.6; }
  #content.doc h1, #content.doc h2, #content.doc h3 { color:var(--text); border-bottom:1px solid var(--glass-border); padding-bottom:6px; }
  #content.doc a.wikilink { color:var(--green); text-decoration:none; border-bottom:1px dashed rgba(140,255,107,0.5); cursor:pointer; }
  #content.doc code { background:#000000; border:1px solid var(--glass-border); padding:2px 6px; border-radius:var(--radius); }
  #content.doc pre { background:#000000; border:1px solid var(--glass-border); padding:12px; border-radius:var(--radius); overflow:auto; }
  #content.graph { padding:0; }
  #content canvas { display:block; touch-action:none; }
  .node {
    display:flex; align-items:center; gap:6px; padding:6px 10px; border-radius:var(--radius);
    transition:background .15s ease;
  }
  .node:hover { background:var(--glass-hover); }
  .node-label { cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
  .dir > .node-label::before { content:"📁 "; }
  .file > .node-label::before { content:"📄 "; }
  .indent { padding-left:14px; }
  .node-actions { display:flex; gap:4px; flex:none; opacity:0; transition:opacity .15s ease; }
  .node:hover .node-actions, .node:focus-within .node-actions { opacity:1; }
  .node-actions button {
    background:transparent; border:1px solid var(--glass-border); color:var(--muted);
    font-size:11px; line-height:1; padding:4px 6px; border-radius:var(--radius); cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .node-actions button:hover { background:var(--glass-hover); color:var(--text); border-color:var(--green); }
  .children {
    display:grid; grid-template-rows:0fr;
    transition:grid-template-rows 200ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .children.open { grid-template-rows:1fr; }
  .children-inner { overflow:hidden; min-height:0; }
  @keyframes contentIn {
    from { opacity:0; transform:translateY(4px); }
    to { opacity:1; transform:translateY(0); }
  }
  .content-in { animation:contentIn 200ms cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes savedFlash {
    0% { box-shadow:0 0 0 3px rgba(140,255,107,0.35); }
    100% { box-shadow:0 0 0 3px rgba(140,255,107,0); }
  }
  .saved-flash { animation:savedFlash 450ms ease-out; border-radius:var(--radius); }
  @media (prefers-reduced-motion: reduce) {
    .children { transition:none; }
    .content-in { animation:none; }
  }
  .tabs { display:flex; gap:6px; padding:14px 16px 12px; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tab {
    padding:8px 16px; border-radius:var(--radius); cursor:pointer; color:var(--muted); font-size:13px; font-weight:500;
    border:1px solid transparent; white-space:nowrap; flex:none;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .tab:hover { background:var(--glass-hover); color:var(--text); }
  .tab.active { background:var(--green); color:#000000; border-color:var(--green); }
  ul { list-style:none; margin:0; padding:0; }
  #content.doc ul { list-style:disc; padding-left:22px; }
  #content.doc li { margin:2px 0; }
  .toolbar { display:flex; gap:8px; margin-bottom:12px; }
  .toolbar button {
    background:#000000; border:1px solid var(--glass-border); color:var(--text);
    padding:6px 16px; border-radius:var(--radius); cursor:pointer; font-size:13px; font-family:system-ui,sans-serif;
    transition:background .15s ease, color .15s ease, border-color .15s ease, transform .1s ease;
  }
  .toolbar button:hover { background:var(--green); color:#000000; border-color:var(--green); }
  .toolbar button:active { transform:scale(0.97); }
  .toolbar button:disabled { opacity:.5; cursor:default; }
  .toolbar button:disabled:hover { background:#000000; color:var(--text); border-color:var(--glass-border); }
  .toolbar input {
    flex:1; min-width:0; background:#000000; border:1px solid var(--glass-border); color:var(--text);
    padding:6px 10px; border-radius:var(--radius); font-size:13px; font-family:ui-monospace,monospace;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .toolbar input:focus { outline:none; border-color:var(--green); box-shadow:0 0 0 3px rgba(140,255,107,0.15); }
  .index-table { width:100%; border-collapse:collapse; font-size:13px; }
  .index-table th, .index-table td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--glass-border); }
  .index-table th { color:var(--muted); font-weight:500; }
  .index-table tbody tr:hover { background:var(--glass-hover); }
  .index-table tr[data-path] { cursor:pointer; }
  .index-table td:nth-child(2), .index-table td:nth-child(3) { color:var(--muted); white-space:nowrap; }
  .index-table td.log-args { font-family:ui-monospace,monospace; max-width:0; width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .index-table td.log-status-error { color:var(--text); font-weight:500; }
  .index-table td.log-status-ok { color:var(--muted); }
  textarea.editor {
    width:100%; height:70vh; background:#000000; color:var(--text); border:1px solid var(--glass-border);
    border-radius:var(--radius); padding:12px; font-family:ui-monospace,monospace; font-size:13px; resize:vertical;
  }
  textarea.editor:focus { outline:none; border-color:var(--green); box-shadow:0 0 0 3px rgba(140,255,107,0.12); }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--glass-border); border-radius:var(--radius); }
  ::-webkit-scrollbar-thumb:hover { background:var(--green); }
  #scrim {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); opacity:0; pointer-events:none;
    transition:opacity .25s ease; z-index:40;
  }
  #scrim.open { opacity:1; pointer-events:auto; }
  .modal-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:70;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .modal-overlay[hidden] { display:none; }
  .modal {
    width:min(420px, 100%); background:var(--glass); backdrop-filter:blur(28px) saturate(140%);
    -webkit-backdrop-filter:blur(28px) saturate(140%); border:1px solid var(--glass-border);
    border-radius:var(--radius); padding:20px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,0.7), inset 0 1px 0 rgba(140,255,107,0.08);
  }
  .modal h2 { margin:0 0 16px; font-size:15px; font-weight:500; }
  .modal label { display:block; font-size:13px; color:var(--muted); margin-bottom:14px; }
  .modal select, .modal input {
    display:block; width:100%; margin-top:6px; background:#000000; border:1px solid var(--glass-border);
    color:var(--text); padding:8px 12px; border-radius:var(--radius); font-size:13px; font-family:ui-monospace,monospace;
  }
  .modal select:focus, .modal input:focus {
    outline:none; border-color:var(--green); box-shadow:0 0 0 3px rgba(140,255,107,0.15);
  }
  .modal .toolbar { margin:6px 0 0; justify-content:flex-end; }
  @media (max-width: 860px) {
    body { padding:8px; gap:8px; }
    .icon-btn { display:flex; }
    #scrim { display:block; }
    aside {
      position:fixed; top:8px; bottom:8px; left:8px; width:min(85vw, 320px); z-index:50;
      transform:translateX(-120%); transition:transform .25s ease;
    }
    aside.open { transform:translateX(0); }
  }
  @media (pointer: coarse) {
    .tab, .node, .toolbar button, .icon-btn { min-height:44px; display:flex; align-items:center; }
    .tab, .toolbar button { justify-content:center; }
    .node-actions { opacity:1; } /* no hover on touch — always show so Rename/Delete stay reachable */
    .node-actions button { min-height:32px; }
  }
</style>
</head>
<body>
<div class="lights" aria-hidden="true">
  <span class="light l1"></span>
  <span class="light l2"></span>
  <span class="light l3"></span>
  <span class="light l4"></span>
  <span class="light l5"></span>
  <span class="light l6"></span>
  <span class="light l7"></span>
  <span class="light l8"></span>
  <span class="light l9"></span>
  <span class="light l10"></span>
</div>
<div id="scrim"></div>
<div id="createModalOverlay" class="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="createModalTitle">
    <h2 id="createModalTitle">New File</h2>
    <label for="createLocation">Location
      <select id="createLocation"></select>
    </label>
    <label for="createName">Name
      <input id="createName" placeholder="filename.js" autocomplete="off" />
    </label>
    <div class="toolbar">
      <button id="createCancel">Cancel</button>
      <button id="createConfirm">Create</button>
    </div>
  </div>
</div>
<aside id="tree"></aside>
<main>
  <div class="tabs" role="tablist" aria-label="View">
    <div class="tab active" data-tab="files" role="tab" aria-selected="true" tabindex="0">Files</div>
    <div class="tab" data-tab="docs" role="tab" aria-selected="false" tabindex="-1">Docs</div>
    <div class="tab" data-tab="graph" role="tab" aria-selected="false" tabindex="-1">Graph</div>
    <div class="tab" data-tab="memory" role="tab" aria-selected="false" tabindex="-1">Memory</div>
    <div class="tab" data-tab="style" role="tab" aria-selected="false" tabindex="-1">Style Guide</div>
    <div class="tab" data-tab="index" role="tab" aria-selected="false" tabindex="-1">Index</div>
    <div class="tab" data-tab="mcp" role="tab" aria-selected="false" tabindex="-1">MCP</div>
  </div>
  <header>
    <button id="menuToggle" class="icon-btn" aria-label="Toggle sidebar" aria-expanded="false"></button>
    <input id="search" placeholder="Search code..." aria-label="Search code" />
  </header>
  <div id="content">Select a file from the tree on the left.</div>
</main>
<script src="app.js"></script>
</body>
</html>
